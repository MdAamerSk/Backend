<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>
<body>
    <h1>Razorpay Payment Gateway</h1>
    <button id="payButton">Pay Now</button>

    <script>

        async function payNow() {
        try {
            // 1. Use relative path if accessing via http://localhost:3000, 
            // and replace with a real Product _id from your MongoDB
            const productId = "6afdd1c9135d70bd525b627c";
            const response = await axios.post(`/api/payments/${productId}/order`);
            const { data } = response;
            const rzp = new window.Razorpay({
                key: data.keyId,
                order_id: data.orderId,
                amount: data.amount * 100,
                currency: data.currency,
                name: "Kapda Co.",
                description: "Payment for order " + data.orderId,
                handler: async function (response) {
                    try {
                        const verifyRes = await axios.post("/api/payments/verify", {
                            orderId: response.razorpay_order_id,
                            paymentId: response.razorpay_payment_id,
                            signature: response.razorpay_signature
                        });
                        alert("Payment successful!");
                        console.log("Verification response:", verifyRes.data);
                    } catch (err) {
                        console.error("Verification failed:", err);
                        alert("Payment verification failed.");
                    }
                },
            });
            rzp.open();
        } catch (error) {
            console.error("Error creating order:", error.response?.data || error.message);
            alert("Failed to initiate payment: " + (error.response?.data?.message || error.message));
        }
    }
    document.getElementById("payButton").addEventListener("click", payNow);
    </script>
</body>
</html>
